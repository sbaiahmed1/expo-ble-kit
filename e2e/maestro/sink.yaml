# P2-02: 1 MB sent through repeated writes without response reaches the test peripheral's byte
# counter (SINK_NO_RSP → SINK_COUNTER), from the developer checks.
#   maestro test e2e/maestro/sink.yaml               # Bumble or the nRF52840 advertising
#   maestro test -e DEMO=true e2e/maestro/sink.yaml  # the app's virtual test peripheral
appId: expo.modules.blekit.example
name: Sink 1 MB
---
- runFlow: _setup.yaml
- tapOn:
    id: tab-checks
- scrollUntilVisible:
    element:
      id: sink-1mb
- tapOn:
    id: sink-1mb
# 20-byte packets (no MTU exchange) on an old phone can take a few minutes.
- extendedWaitUntil:
    visible:
      id: sink-status
      text: "Complete: 1048576 / 1048576 bytes.*"
    timeout: 300000
- copyTextFrom:
    id: sink-status
- evalScript: ${console.log(maestro.copiedText)}
