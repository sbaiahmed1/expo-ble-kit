import groovy.json.JsonSlurper

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

def packageJson = new JsonSlurper().parse(file("../package.json"))

group = 'expo.modules.blekit'
version = packageJson.version

// Instrumented tests (L3, plan §8.1) read the test GATT profile from their assets.
def testProfileAssetsDir = layout.buildDirectory.dir("generated/testProfileAssets")
def copyTestProfile = tasks.register("copyTestProfile", Copy) {
  from("../test-peripherals/profile.json")
  into(testProfileAssetsDir)
}

android {
  namespace "expo.modules.blekit"
  defaultConfig {
    // ADR-002: the Android core relies on API 26+ calls. Declaring it here also makes the manifest
    // merge fail loudly for apps below 26 instead of crashing at runtime.
    minSdkVersion 26
    versionCode 1
    versionName packageJson.version
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  sourceSets {
    androidTest.assets.srcDirs += testProfileAssetsDir.get().asFile
  }
  lintOptions {
    abortOnError false
  }
}

tasks.matching { it.name.contains("AndroidTestAssets") }.configureEach {
  dependsOn(copyTestProfile)
}

dependencies {
  androidTestImplementation "androidx.test:runner:1.7.0"
  androidTestImplementation "androidx.test:rules:1.7.0"
  androidTestImplementation "androidx.test.ext:junit:1.3.0"
}
