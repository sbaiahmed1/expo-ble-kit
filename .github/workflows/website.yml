# Builds the documentation website (website/) and publishes it to GitHub Pages:
# https://sbaiahmed1.github.io/expo-ble-kit/
name: Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - src/**
      - CHANGELOG.md
      - .changeset/**
      - tsconfig.json
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The API reference compiles the library's sources, which need the root dependencies.
      - run: yarn install --immutable
      - run: yarn install --immutable
        working-directory: website
      - run: yarn build
        working-directory: website
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
